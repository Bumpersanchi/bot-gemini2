# Blueprint de Render: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: whatsapp-claude-bot
    runtime: python
    plan: starter # el plan "free" se duerme tras 15 min sin uso y borra el historial
    buildCommand: pip install -r requirements.txt
    # Un solo proceso: el historial de conversaciones vive en memoria.
    startCommand: gunicorn -w 1 --threads 8 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.2"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
